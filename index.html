<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Fuite d'Eau — Générateur d'e-mails</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.5rem; text-align: center; }
  .logo { text-align: center; margin-bottom: 0.5rem; font-size: 13px; color: #888; letter-spacing: 0.05em; text-transform: uppercase; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .tab { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #666; font-size: 14px; cursor: pointer; text-align: center; transition: all 0.15s; font-family: Arial, sans-serif; }
  .tab.active { background: #003B6F; color: #fff; border-color: #003B6F; font-weight: 600; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
  .field input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; font-family: Arial, sans-serif; color: #1a1a1a; outline: none; }
  .field input:focus { border-color: #003B6F; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bloc { margin-bottom: 1rem; padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; }
  .bloc-title { font-size: 12px; color: #888; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn-wrap { margin-top: 0.25rem; }
  .btn { display: block; width: 100%; padding: 12px; background: #003B6F; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; font-family: Arial, sans-serif; text-align: center; text-decoration: none; transition: background 0.15s; }
  .btn:hover { background: #00295a; }
  .section { display: none; }
  .section.active { display: block; }
  .divider { height: 1px; background: #eee; margin: 1rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SOS Fuite d'Eau</div>
  <h1>Générateur d'e-mails RDV</h1>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('proposition')">Proposition de RDV</button>
    <button class="tab" onclick="switchTab('confirmation')">Confirmation de RDV</button>
  </div>

  <div id="proposition" class="section active">
    <div class="card">
      <div class="field">
        <label>E-mail du destinataire</label>
        <input type="email" id="p_email" placeholder="client@exemple.fr">
      </div>
      <div class="field">
        <label>Référence dossier</label>
        <input type="text" id="p_ref" placeholder="ex : I2853746 - 7296">
      </div>
      <div class="divider"></div>
      <div class="bloc">
        <div class="bloc-title">1ère proposition</div>
        <div class="row">
          <div class="field" style="margin:0"><label>Date</label><input type="date" id="p_date1"></div>
          <div class="field" style="margin:0"><label>Heure</label><input type="time" id="p_heure1"></div>
        </div>
      </div>
      <div class="bloc">
        <div class="bloc-title">2ème proposition</div>
        <div class="row">
          <div class="field" style="margin:0"><label>Date</label><input type="date" id="p_date2"></div>
          <div class="field" style="margin:0"><label>Heure</label><input type="time" id="p_heure2"></div>
        </div>
      </div>
      <div class="btn-wrap">
        <a id="p_link" class="btn" href="#">✉ Ouvrir dans Outlook</a>
      </div>
    </div>
  </div>

  <div id="confirmation" class="section">
    <div class="card">
      <div class="field">
        <label>E-mail du destinataire</label>
        <input type="email" id="c_email" placeholder="client@exemple.fr">
      </div>
      <div class="field">
        <label>Référence dossier</label>
        <input type="text" id="c_ref" placeholder="ex : I2853746 - 7296">
      </div>
      <div class="divider"></div>
      <div class="row">
        <div class="field"><label>Date du RDV</label><input type="date" id="c_date"></div>
        <div class="field"><label>Heure du RDV</label><input type="time" id="c_heure"></div>
      </div>
      <div class="field">
        <label>Durée estimée</label>
        <input type="text" id="c_duree" placeholder="ex : 1h30" value="1h30">
      </div>
      <div class="btn-wrap">
        <a id="c_link" class="btn" href="#">✉ Ouvrir dans Outlook</a>
      </div>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='proposition'&&i===0)||(tab==='confirmation'&&i===1)));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

function formatDate(dateStr) {
  if (!dateStr) return '___';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function formatHeure(timeStr) {
  if (!timeStr) return '___';
  return timeStr.replace(':', 'h');
}

function updateProposition() {
  const email = document.getElementById('p_email').value;
  const ref = document.getElementById('p_ref').value || '___';
  const d1 = formatDate(document.getElementById('p_date1').value);
  const h1 = formatHeure(document.getElementById('p_heure1').value);
  const d2 = formatDate(document.getElementById('p_date2').value);
  const h2 = formatHeure(document.getElementById('p_heure2').value);
  const sujet = `Proposition de rdv - SOS FUITE D'EAU - Dossier : ${ref}`;
  const corps = `Madame, Monsieur,\n\nDans le cadre du dossier de recherche de fuite référencé SOS FUITE D'EAU : ${ref}, nous vous proposons les créneaux suivants :\n\n• Le ${d1} à ${h1} (durée estimée : 1h30)\nou\n• Le ${d2} à ${h2} (durée estimée : 1h30)\n\nConformément aux dispositions de la loi n°65-557 du 10 juillet 1965, votre présence ou celle d'un représentant ainsi que l'accès au logement sont indispensables à la réalisation de cette intervention mandatée par le syndic.\n\nNous vous remercions de bien vouloir nous faire parvenir votre réponse sous 48 heures. En présence de plusieurs occupants ou propriétaires concernés, la date d'intervention retenue sera celle recueillant la majorité des réponses favorables parmi les personnes convoquées.\n\nConformément aux dispositions de la loi n°65-557 du 10 juillet 1965, tout refus d'accès ou obstacle à la réalisation de l'intervention pourra être porté à la connaissance du syndic et engager la responsabilité du propriétaire ou de l'occupant pour les conséquences dommageables résultant du retard apporté au traitement du sinistre.\n\nÀ défaut de réponse dans ce délai, le syndic sera informé de l'absence de retour.\n\nCordialement,`;
  document.getElementById('p_link').href = `mailto:${email}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
}

function updateConfirmation() {
  const email = document.getElementById('c_email').value;
  const ref = document.getElementById('c_ref').value || '___';
  const date = formatDate(document.getElementById('c_date').value);
  const heure = formatHeure(document.getElementById('c_heure').value);
  const duree = document.getElementById('c_duree').value || '1h30';
  const sujet = `Confirmation de rdv - SOS FUITE D'EAU - Dossier : ${ref}`;
  const corps = `Madame, Monsieur,\n\nNous vous confirmons votre rendez-vous de recherche de fuite prévu le ${date} à ${heure}.\n\nRéférence dossier SOS FUITE D'EAU : ${ref}\n\nConformément aux dispositions de la loi n°65-557 du 10 juillet 1965, votre présence ou celle d'un représentant ainsi que l'accès au logement sont indispensables à la réalisation de cette intervention mandatée par le syndic.\n\nLa durée estimée de l'intervention est d'environ ${duree}.\n\nTout refus d'accès susceptible de retarder l'identification ou la résolution du sinistre pourra engager la responsabilité du propriétaire en cas de préjudice causé à la copropriété ou aux lots voisins.\n\nCordialement,`;
  document.getElementById('c_link').href = `mailto:${email}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
}

['p_email','p_ref','p_date1','p_heure1','p_date2','p_heure2'].forEach(id => document.getElementById(id).addEventListener('input', updateProposition));
['c_email','c_ref','c_date','c_heure','c_duree'].forEach(id => document.getElementById(id).addEventListener('input', updateConfirmation));
</script>
</body>
</html>
